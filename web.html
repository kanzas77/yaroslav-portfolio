<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Веб и чат-боты — Ярослав Ковалец</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:#2C4A38;
  background:linear-gradient(180deg, #F7FBEA 0%, #EFF7DC 45%, #E6F2CE 100%);
  min-height:100vh;
  padding-bottom:80px;
}

/* ===== ШАПКА: комбо — размытое фото + соты по бокам ===== */
.hero {
  position:relative;
  height:340px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:30px 20px;
  overflow:hidden;
  background:#DDEBCC;
}
@media (min-width:1024px) {
  .hero { height:480px; }
}
/* Слой 1: то же фото, размытое и осветлённое — заполняет бока */
.hero::before {
  content:'';
  position:absolute;
  inset:-30px;
  background:url('header-web.jpg') center/cover no-repeat;
  filter:blur(22px) brightness(1.6);
  transform:scale(1.12);
  z-index:0;
}
/* Слой 2: светлая вуаль — осветляет размытые бока */
.hero-veil {
  position:absolute;
  inset:0;
  background:rgba(247,251,234,0.55);
  z-index:1;
}
/* Слой 3: узор «соты», нарисованный кодом, виден только по бокам */
.hero-pattern {
  position:absolute;
  inset:0;
  z-index:2;
  background-image:url("data:image/svg+xml,%3Csvg width='28' height='49' viewBox='0 0 28 49' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%232F7D4F' fill-opacity='0.18'%3E%3Cpath d='M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9zM0 15l12.98-7.5V0h-2v6.35L0 12.69v2.3zm0 18.5L12.98 41v8h-2v-6.85L0 35.81v-2.3zM15 0v7.5L27.99 15H28v-2.31h-.01L17 6.35V0h-2zm0 49v-8l12.99-7.5H28v2.31h-.01L17 42.15V49h-2z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  -webkit-mask-image:linear-gradient(to right, #000 0%, #000 18%, transparent 34%, transparent 66%, #000 82%, #000 100%);
  mask-image:linear-gradient(to right, #000 0%, #000 18%, transparent 34%, transparent 66%, #000 82%, #000 100%);
}
/* Слой 4: резкое фото целиком в центре, края растворяются */
.hero-photo {
  position:absolute;
  inset:0;
  background:url('header-web.jpg') center/contain no-repeat;
  z-index:3;
  -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
  mask-image:linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
}
/* Слой 5: лёгкое затемнение снизу для читаемости заголовка */
.hero::after {
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(5,38,27,0) 45%, rgba(5,38,27,0.55) 100%);
  z-index:4;
}
.hero-content {
  position:relative;
  z-index:5;
  text-align:center;
  max-width:900px;
}
.hero h1 {
  font-size:42px;
  margin-bottom:10px;
  color:#F5E9D0;
}
.hero p {
  font-size:18px;
  color:#DFF3E4;
  opacity:0.95;
}

/* Верхнее меню */
.topbar {
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,0.93);
  backdrop-filter:blur(8px);
  padding:12px 20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  box-shadow:0 4px 20px rgba(27,94,59,0.12);
}
.topbar a {
  color:#1B5E3B;
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  padding:10px 18px;
  border-radius:10px;
  transition:all .2s;
}
.topbar a:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(27,94,59,.2); }
.topbar .home { background:#E4F3E8; }
.topbar .nav-sites { background:#4CAF6D; color:#fff; }
.topbar .nav-planner { background:#58B368; color:#fff; }
.topbar .nav-bots { background:#2F7D4F; color:#fff; }
.topbar .nav-demo { background:#6FBF85; color:#fff; }

.wrap { max-width:1100px; margin:0 auto; padding:0 20px; }

section {
  margin:50px 0;
  scroll-margin-top:90px;
}
.section-title {
  font-size:30px;
  color:#1B5E3B;
  margin-bottom:8px;
}
.section-sub {
  color:#3E6B4F;
  margin-bottom:30px;
  font-size:16px;
}

/* Карточки */
.card {
  background:#FFFFFF;
  border:1px solid #BFE0C8;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 8px 24px rgba(27,94,59,0.08);
}
.card h3 {
  color:#2F7D4F;
  font-size:22px;
  margin-bottom:12px;
}
.card p {
  color:#33523F;
  line-height:1.6;
  margin-bottom:16px;
}
.card .tag {
  display:inline-block;
  background:#E4F3E8;
  color:#2F7D4F;
  padding:4px 12px;
  border-radius:20px;
  font-size:12px;
  margin-right:6px;
  margin-bottom:6px;
  border:1px solid #BFE0C8;
}
.btn {
  display:inline-block;
  padding:12px 24px;
  border-radius:10px;
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  transition:all .2s;
  margin-right:10px;
  margin-top:8px;
}
.btn-primary {
  background:linear-gradient(135deg,#4CAF6D,#7DC98F);
  color:#fff;
}
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(76,175,109,.4); }
.btn-ghost {
  background:transparent;
  color:#2F7D4F;
  border:1px solid #4CAF6D;
}
.btn-ghost:hover { background:#E4F3E8; }

.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; }

.price-tag {
  display:inline-block;
  background:linear-gradient(135deg,#4CAF6D,#7DC98F);
  color:#fff;
  padding:8px 16px;
  border-radius:8px;
  font-weight:bold;
  font-size:18px;
  margin:10px 0;
}

.keybox {
  background:#EAF6EC;
  border:1px dashed #4CAF6D;
  border-radius:12px;
  padding:20px;
  text-align:center;
  margin:16px 0;
}
.keybox code {
  display:inline-block;
  background:#14532D;
  color:#B9F0C9;
  padding:10px 20px;
  border-radius:8px;
  font-size:18px;
  font-weight:bold;
  letter-spacing:1px;
  margin-top:10px;
  font-family:'Courier New',monospace;
}

.info-block {
  background:#EAF6EC;
  border-left:4px solid #4CAF6D;
  padding:16px 20px;
  border-radius:8px;
  margin:16px 0;
  font-size:14px;
  line-height:1.6;
  color:#2C4A38;
}
.info-block code {
  background:#DCEFE2;
  padding:2px 6px;
  border-radius:4px;
  font-size:12px;
}

.mini {
  background:#F3FAF5;
  border:1px solid #DCEFE2;
  padding:16px;
  border-radius:10px;
}
.mini strong { color:#2F7D4F; }
.mini p { font-size:13px; margin-top:6px; color:#33523F; }

.msg-btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
.msg-btn {
  flex:1;
  min-width:160px;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  text-align:center;
  color:#fff;
  transition:transform .2s;
}
.msg-btn:hover { transform:translateY(-2px); }
.msg-btn.vk { background:#0077FF; }
.msg-btn.max { background:#8B5CF6; }
.msg-btn.tg { background:#229ED9; }

/* Демо-бот виджет */
.demo-widget {
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:1000;
}
.demo-toggle {
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(135deg,#4CAF6D,#7DC98F);
  border:none;
  color:#fff;
  font-size:28px;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(76,175,109,.5);
  transition:transform .2s;
}
.demo-toggle:hover { transform:scale(1.1); }
.demo-chat {
  position:absolute;
  bottom:75px;
  right:0;
  width:320px;
  max-height:450px;
  background:#FFFFFF;
  border:1px solid #4CAF6D;
  border-radius:16px;
  display:none;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(27,94,59,0.25);
}
.demo-chat.open { display:flex; }
.demo-header {
  background:#E4F3E8;
  padding:14px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #BFE0C8;
}
.demo-avatar {
  width:36px;
  height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,#4CAF6D,#7DC98F);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}
.demo-header-text { color:#1B5E3B; font-weight:bold; font-size:14px; }
.demo-header-sub { color:#3E6B4F; font-size:11px; opacity:0.8; }
.demo-messages {
  flex:1;
  padding:14px;
  overflow-y:auto;
  max-height:280px;
  background:#F3FAF5;
}
.demo-msg {
  margin-bottom:10px;
  padding:10px 12px;
  border-radius:12px;
  font-size:13px;
  line-height:1.4;
  max-width:85%;
}
.demo-msg.bot {
  background:#E4F3E8;
  color:#1F3A2C;
  border-bottom-left-radius:4px;
}
.demo-msg.user {
  background:#4CAF6D;
  color:#fff;
  margin-left:auto;
  border-bottom-right-radius:4px;
  font-weight:500;
}
.demo-options {
  padding:10px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  background:#FFFFFF;
  border-top:1px solid #BFE0C8;
}
.demo-opt {
  background:#E4F3E8;
  border:1px solid #4CAF6D;
  color:#2F7D4F;
  padding:6px 12px;
  border-radius:16px;
  font-size:12px;
